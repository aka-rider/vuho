[package]
name = "vuho-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Vuho dictation overlay (GPUI)"

[[bin]]
name = "vuho"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
vuho-domain = { workspace = true }
vuho-stt-engine = { workspace = true }
vuho-dictation = { workspace = true }
vuho-model-fetch = { workspace = true }
vuho-model-paths = { workspace = true }
vuho-os-integration = { workspace = true }
vuho-settings = { workspace = true }
crossbeam-channel = { workspace = true }
fastrand = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
raw-window-handle = { workspace = true }
dispatch2 = { workspace = true }

[dev-dependencies]
# Enables `SettingsStore::new_temp` for `wiring.rs`'s provisioning-state-machine
# property test — the `test-util` feature is only active for test/bench builds
# (resolver v2), never in the shipped binary.
vuho-settings = { workspace = true, features = ["test-util"] }

[features]
default = []
demo = []

[lints]
workspace = true
