name: Release

on:
  push:
    tags:
      - "v*"

# A tag push creates exactly one release; a second push to the same tag
# (e.g. a force-pushed tag) should not race a half-finished job for the
# same artifact. Different tags use different refs, so this never blocks
# two distinct versions from releasing concurrently.
#
# cancel-in-progress is false, deliberately: this job creates a GitHub
# Release and uploads an asset partway through its run. Cancelling a run
# that already did that (because someone force-pushed the same tag again)
# would leave a published release with a partial/missing asset behind —
# worse than letting the in-flight run finish and a second run simply
# queue behind it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Narrowest permission that can create a GitHub release and upload assets.
permissions:
  contents: write

# Vuho is Apple Silicon macOS only (CLAUDE.md) — Metal (via GPUI) is
# required to build, so this can only run on a macOS runner. macos-15 is
# the current GA arm64 runner image, matching ci.yml; macos-14 is
# deprecated (GitHub's runner-images docs, checked 2026-07).
jobs:
  release:
    runs-on: macos-15
    # Job-level so later steps' `if:` conditions can branch on whether it's
    # configured, without each step re-deriving that from `secrets` (which
    # `if:` can reference directly, but env is what the two Homebrew-cask
    # steps below key off of for a single readable on/off signal).
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # Full history, not the default shallow (fetch-depth: 1) clone.
      # bundle-macos.sh derives CFBundleVersion from `git rev-list --count
      # HEAD`; on a shallow clone that is always 1, so every release would
      # ship the same build number and LaunchServices could not tell which
      # build is newer on an in-place upgrade — the exact property the
      # commit-count scheme exists to provide.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # A separate cache key from ci.yml's: this job builds --release
      # (ci.yml only ever builds/tests in debug profile), so the compiled
      # target/ artifacts are not interchangeable with the debug cache —
      # sharing a key would mean every release job either misses entirely
      # or, worse, restores a debug target/ that a --release build then
      # has to partially rebuild around. A dedicated "release" key keeps
      # both caches useful across their own kind of run.
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # A tag can point at any commit, including one ci.yml never ran
      # (e.g. `git tag` on a branch pushed straight to a commit, or a tag
      # moved by hand). Re-run the same gates ci.yml applies to main
      # before this commit becomes a public download — trusting "CI must
      # have passed" would be trusting a fact this workflow never checks.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No `models/` is available on this runner (gitignored, provisioned
      # out-of-band). Model-gated tests skip cleanly rather than fail, same
      # as ci.yml's `cargo test --workspace` step.
      - name: cargo test --workspace
        run: cargo test --workspace

      # The cask URL is `Vuho-#{version}-arm64.tar.gz`, built from the tag.
      # The tag is the single source of truth for the released version. Every
      # downstream consumer — the .app's CFBundleShortVersionString (via
      # $VUHO_VERSION, which bundle-macos.sh prefers over `cargo metadata`),
      # the tarball name, and the Homebrew cask's `version` stanza — derives
      # from this one string, so a cask pointing at a URL that 404s is
      # unrepresentable rather than something an equality check catches after
      # the fact. Cargo.toml holds a fixed "0.0.0-dev" sentinel and is never
      # bumped; there is no second copy of the version to drift from.
      #
      # What can still go wrong is a malformed tag, so that is what is checked
      # here: `v0.9` (a real mistake this repo has made) yields the version
      # "0.9", which would ship a cask and a bundle whose version is not
      # MAJOR.MINOR.PATCH. Reject it now, at the one place a human's typo
      # enters the system, rather than in a user's `brew install`.
      - name: Derive and verify VERSION
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag:           $GITHUB_REF_NAME"
          echo "Tag version:   $TAG_VERSION"

          # Strict MAJOR.MINOR.PATCH, optionally with a -prerelease suffix.
          # No leading zeros, no 2-component "0.9", no trailing junk.
          if ! [[ "$TAG_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not yield a MAJOR.MINOR.PATCH version (got '$TAG_VERSION'). Tag as e.g. v0.9.0."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      # Model-less package: VUHO_BUNDLE_MODEL=0 skips the ~474 MB Parakeet-TDT
      # copy and its preconditions, so this build never touches the Hugging
      # Face download. models.lock.json (committed) is only needed for the
      # runtime download path, not for building the app itself.
      #
      # VUHO_VERSION is what makes the tag drive the bundle: without it,
      # bundle-macos.sh falls back to `cargo metadata` and would stamp the
      # "0.0.0-dev" sentinel into a released .app.
      - name: Package Vuho.app (model-less)
        env:
          VUHO_VERSION: ${{ steps.version.outputs.version }}
        run: VUHO_BUNDLE_MODEL=0 ./scripts/package.sh

      - name: Verify Vuho.app (model-less)
        run: VUHO_BUNDLE_MODEL=0 ./scripts/verify-app.sh

      # verify-app.sh only asserts the __VERSION__ placeholder was substituted
      # by *something*; it cannot know which version was intended. Assert the
      # shipped bundle carries the tag's version specifically — otherwise a
      # future refactor that drops the env: block above would silently publish
      # a "0.0.0-dev" .app inside a correctly-named tarball.
      - name: Verify bundle version matches tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw Vuho.app/Contents/Info.plist)"
          echo "Bundle CFBundleShortVersionString: $BUNDLE_VERSION"
          if [[ "$BUNDLE_VERSION" != "$VERSION" ]]; then
            echo "::error::Bundle version ($BUNDLE_VERSION) does not match tag version ($VERSION)"
            exit 1
          fi

      # bundle-macos.sh places the bundle at the repo root
      # ($WORKSPACE_ROOT/Vuho.app), not a staging directory, so `-C
      # "$GITHUB_WORKSPACE"` is what makes the tar's only top-level entry
      # `Vuho.app/` — a `cask "vuho"` stanza's `app "Vuho.app"` artifact
      # requires exactly that, with no leading path component.
      - name: Archive tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tar -C "$GITHUB_WORKSPACE" -czf "Vuho-${VERSION}-arm64.tar.gz" Vuho.app

      # A wrong prefix (e.g. a leading "./" or a staging-dir component)
      # silently produces a cask that "installs" without error but leaves
      # no Vuho.app in /Applications. Assert the exact entry now, rather
      # than let a Homebrew user discover it.
      - name: Verify tarball layout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          first_entry="$(tar -tzf "Vuho-${VERSION}-arm64.tar.gz" | head -1)"
          echo "First tar entry: $first_entry"
          if [[ "$first_entry" != "Vuho.app/" ]]; then
            echo "::error::Expected first tarball entry to be 'Vuho.app/', got '$first_entry'"
            exit 1
          fi

      # An ad-hoc code signature surviving tar/untar byte-for-byte is an
      # assumption, not a guarantee (extended attributes and resource
      # forks are the usual casualties). This is the one cheap place to
      # falsify that assumption before a `brew install --cask` user does,
      # by re-verifying against a copy that actually went through
      # tar/untar rather than the freshly-built original.
      - name: Verify signature survives archive round-trip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scratch="$(mktemp -d)"
          tar -xzf "Vuho-${VERSION}-arm64.tar.gz" -C "$scratch"
          codesign --verify --deep --strict "$scratch/Vuho.app"

      # Recorded for humans only — to compare against a download by hand, or
      # to diagnose a cask mismatch. The cask's own `sha256` stanza is NOT
      # fed from here: aka-rider/homebrew-tap's release-vuho.yml recomputes it
      # from the published asset, so the value users' Homebrew verifies is
      # derived from the artifact actually being served rather than from this
      # job's local copy of it.
      - name: Compute tarball SHA-256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256="$(shasum -a 256 "Vuho-${VERSION}-arm64.tar.gz" | awk '{print $1}')"
          echo "SHA-256: $SHA256"
          {
            echo "### Vuho-${VERSION}-arm64.tar.gz"
            echo ""
            echo "\`\`\`"
            echo "$SHA256"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: Vuho-*-arm64.tar.gz

      # Hand off to the tap, which owns cask updates for every project in it
      # (see also its release-rune.yml / release-whisper.yml). This step only
      # says "0.9.0 is published"; aka-rider/homebrew-tap's release-vuho.yml
      # re-downloads the asset, computes the sha256 from what users will
      # actually get, rewrites Casks/vuho.rb and pushes — so the checksum is
      # verified against the published artifact rather than restated from
      # this builder's own belief about it.
      #
      # This must run after "Upload release": the tap fetches the asset by
      # URL, so dispatching earlier is a race against the upload.
      #
      # Needs a `HOMEBREW_TAP_TOKEN` repo secret (a fine-grained PAT scoped to
      # aka-rider/homebrew-tap with `contents: write`, which is what the
      # dispatches endpoint requires). GitHub has no cross-repo trigger and
      # the default GITHUB_TOKEN is scoped to this repo only, so some token
      # is unavoidable for an instant publish. If the secret is absent this
      # step is a documented no-op (see the fallback below) rather than a
      # failure: publishing the release must not depend on tap credentials.
      - name: Trigger homebrew-tap cask publish
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # An expired or under-scoped PAT is the expected way this breaks, and
          # it breaks *after* the release is already published — so say plainly
          # what is still fine, what is not, and how to finish the job by hand.
          # A bare `gh` HTTP 404 here reads like the tap is missing.
          if ! gh api repos/aka-rider/homebrew-tap/dispatches \
                 -f event_type=vuho-release \
                 -f "client_payload[version]=${VERSION}"; then
            echo "::error::Dispatch to aka-rider/homebrew-tap failed. The v${VERSION} release IS published; only the cask is stale. Most likely HOMEBREW_TAP_TOKEN is expired or lacks 'contents: write' on the tap (the endpoint 404s rather than 403s when under-scoped). Re-mint it, then run: gh workflow run release-vuho.yml --repo aka-rider/homebrew-tap -f vuho_version=v${VERSION}"
            exit 1
          fi
          echo "Dispatched vuho-release (version=${VERSION}) to aka-rider/homebrew-tap."
          {
            echo "### Homebrew cask"
            echo ""
            echo "Dispatched \`vuho-release\` (version \`${VERSION}\`) to aka-rider/homebrew-tap."
            echo "Watch: https://github.com/aka-rider/homebrew-tap/actions/workflows/release-vuho.yml"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Homebrew cask update — manual step required (no HOMEBREW_TAP_TOKEN configured)
        if: ${{ env.HOMEBREW_TAP_TOKEN == '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Manual Homebrew cask update required"
            echo ""
            echo "\`HOMEBREW_TAP_TOKEN\` is not configured on this repo, so the tap was"
            echo "never told about this release. Run the bump by hand:"
            echo ""
            echo "\`\`\`sh"
            echo "gh workflow run release-vuho.yml --repo aka-rider/homebrew-tap -f vuho_version=v${VERSION}"
            echo "\`\`\`"
            echo ""
            echo "That workflow computes the sha256 from the published asset itself, so"
            echo "there is no hash to copy by hand and no way to update one field"
            echo "without the other."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::HOMEBREW_TAP_TOKEN not set — run: gh workflow run release-vuho.yml --repo aka-rider/homebrew-tap -f vuho_version=v${VERSION}"
