name: CI

on:
  push:
    branches: [main]
  pull_request:

# Vuho is Apple Silicon macOS only (CLAUDE.md) — Metal (via GPUI) is
# required to build, so this can only run on a macOS runner. macos-15 is
# the current GA arm64 runner image; macos-14 is deprecated (GitHub's
# runner-images docs, checked 2026-07) — pin to a label that's still
# provisioned rather than one riding toward removal out from under CI.
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No `models/` (gitignored, ~1.4 GB, provisioned out-of-band via
      # scripts/fetch-model.sh) or real signed binary is available on this
      # runner. Model-gated tests (vuho-stt-engine's coreml::tests/vad::tests,
      # tests/batch_multiwindow.rs) and the mic-requiring
      # `streaming_smoke` must skip cleanly rather than fail — this is the
      # first time that "skips cleanly on CI" claim is actually exercised,
      # per CLAUDE.md's platform notes.
      - name: cargo test --workspace
        run: cargo test --workspace
