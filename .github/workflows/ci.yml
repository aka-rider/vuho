name: CI

on:
  push:
    branches: [main]
  pull_request:

# The full workspace builds on macOS only (the UI needs Metal via GPUI), so
# `check` runs on a macOS runner; `linux` runs the crates that are real on
# Linux (ADR-024). macos-15 is the current GA arm64 runner image; macos-14
# is deprecated (GitHub's runner-images docs, checked 2026-07) — pin to a
# label that's still provisioned rather than one riding toward removal.
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # No `models/` (gitignored, ~1.4 GB, provisioned out-of-band via
      # scripts/fetch-model.sh) or real signed binary is available on this
      # runner. Model-gated tests (vuho-stt-engine's coreml::tests/vad::tests,
      # tests/batch_multiwindow.rs) and the mic-requiring
      # `streaming_smoke` must skip cleanly rather than fail — this is the
      # first time that "skips cleanly on CI" claim is actually exercised,
      # per CLAUDE.md's platform notes.
      - name: cargo test --workspace
        run: cargo test --workspace

  linux:
    runs-on: ubuntu-24.04
    env:
      LINUX_CRATES: -p vuho-domain -p vuho-postprocess -p vuho-model-paths -p vuho-settings -p vuho-model-fetch -p vuho-audio -p vuho-stt-engine -p test-stt-ffi
      APT_PACKAGES: pkg-config libssl-dev libasound2-dev libwayland-dev libxkbcommon-dev libfontconfig-dev libvulkan1 mesa-vulkan-drivers clang cmake
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $APT_PACKAGES

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: Clippy (Linux-ready crates, deny warnings)
        run: cargo clippy ${{ env.LINUX_CRATES }} --all-targets -- -D warnings

      - name: Test (Linux-ready crates)
        run: cargo test ${{ env.LINUX_CRATES }}
